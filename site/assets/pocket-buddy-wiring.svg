<text x="76" y="348" font-size="13" fill="#1c2230" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">3V3 → OLED VCC</text>
<rect x="40" y="366" width="26" height="6" rx="3" fill="#1f2430"/>
<text x="76" y="374" font-size="13" fill="#1c2230" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">GND → OLED GND, button, shared</text>
<rect x="40" y="392" width="26" height="6" rx="3" fill="#2563eb"/>
<text x="76" y="400" font-size="13" fill="#1c2230" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">D4 → OLED SDA</text>
<rect x="40" y="418" width="26" height="6" rx="3" fill="#e69b00"/>
<text x="76" y="426" font-size="13" fill="#1c2230" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">D5 → OLED SCL</text>
<rect x="40" y="444" width="26" height="6" rx="3" fill="#16a34a"/>
<text x="76" y="452" font-size="13" fill="#1c2230" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">D1 → button (other leg to GND)</text>
<rect x="40" y="496" width="262" height="124" rx="10" fill="#fff4e5" stroke="#e69b00" stroke-width="2"/>
<text x="54" y="520" font-size="14" fill="#7a4a00" text-anchor="start" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Check before you connect</text>
<text x="54" y="542" font-size="12" fill="#5a3a00" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">• Battery plugs have no standard</text>
<text x="54" y="558" font-size="12" fill="#5a3a00" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">  polarity: match red (+) / black (−)</text>
<text x="54" y="574" font-size="12" fill="#5a3a00" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">  with a multimeter first.</text>
<text x="54" y="596" font-size="12" fill="#5a3a00" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">• OLED pin order differs: follow the</text>
<text x="54" y="612" font-size="12" fill="#5a3a00" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">  labels printed on your module.</text>
<text x="672" y="420" font-size="12" fill="#4a5568" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">All grounds meet at the</text>
<text x="672" y="436" font-size="12" fill="#4a5568" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">single GND pin.</text>
<text x="672" y="462" font-size="12" fill="#4a5568" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">No resistor needed: the</text>
<text x="672" y="478" font-size="12" fill="#4a5568" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">button uses the board's</text>
<text x="672" y="494" font-size="12" fill="#4a5568" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">internal pull-up.</text>
