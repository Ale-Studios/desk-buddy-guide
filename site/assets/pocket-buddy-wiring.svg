<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="880" height="640" role="img" aria-labelledby="t d">
<title id="t">Pocket buddy wiring diagram</title>
<desc id="d">A Seeed XIAO ESP32-C3 board connected to an SSD1306 OLED (3V3, GND, SDA to D4, SCL to D5), a push button between D1 and GND, and a LiPo battery to the BAT+ and BAT- pads on the back of the board.</desc>
